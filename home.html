<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FNAF Pizzeria - Walkaround</title>
    <style>
        /* Reset and fullscreen */
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        canvas {
            display: block;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            inset: 0;
            background: #0a0a0f;
            color: #ff6b35;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 100;
            transition: opacity 0.8s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a2a3a;
            border-top: 4px solid #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* HUD overlay */
        #hud {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            user-select: none;
            border: 1px solid rgba(255, 107, 53, 0.3);
            z-index: 10;
            transition: opacity 0.5s;
        }
        #hud .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: bold;
            color: #ff6b35;
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 30px;
            pointer-events: none;
            z-index: 10;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Freddy Fazbear's Pizza...</div>
        <div style="font-size:14px;color:#888;margin-top:10px;">Please wait</div>
    </div>

    <!-- Crosshair -->
    <div id="crosshair">+</div>

    <!-- HUD -->
    <div id="hud">
        <span class="key">W</span> <span class="key">A</span>
        <span class="key">S</span> <span class="key">D</span> to move &nbsp;·&nbsp;
        <span class="key">Mouse</span> to look &nbsp;·&nbsp;
        <span class="key">Shift</span> to sprint &nbsp;·&nbsp;
        Click to lock mouse
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <!-- Main Game Script -->
    <script type="module">
        // ----- Imports -----
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ----- DOM refs -----
        const loadingEl = document.getElementById('loading');

        // ----- Scene Setup -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f); // Dark atmosphere

        // Camera
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 1.7, 5); // Eye height ~1.7 units

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ----- Controls (First-Person) -----
        const controls = new PointerLockControls(camera, renderer.domElement);

        // Click to lock pointer
        renderer.domElement.addEventListener('click', () => {
            if (!controls.isLocked) controls.lock();
        });

        // ----- Lighting -----
        // Ambient - dim, horror atmosphere
        const ambient = new THREE.AmbientLight(0x223355, 0.4);
        scene.add(ambient);

        // Main warm light (like old pizzeria lights)
        const mainLight = new THREE.DirectionalLight(0xffcc88, 2.0);
        mainLight.position.set(5, 8, 3);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 30;
        mainLight.shadow.camera.left = -15;
        mainLight.shadow.camera.right = 15;
        mainLight.shadow.camera.top = 15;
        mainLight.shadow.camera.bottom = -15;
        scene.add(mainLight);

        // Fill light from back
        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
        fillLight.position.set(-3, 2, -5);
        scene.add(fillLight);

        // Small accent lights (like neon)
        const accentColors = [0xff3366, 0x33ccff, 0xffcc00];
        accentColors.forEach((color, i) => {
            const light = new THREE.PointLight(color, 0.5, 10);
            light.position.set(
                (i - 1) * 4,
                2.5,
                -3 + i * 2
            );
            scene.add(light);
        });

        // ----- Load the GLB Model -----
        const loader = new GLTFLoader();

        // IMPORTANT: Change this path to where your model is located
        const MODEL_PATH = './fnaf_pizzeria.glb';

        let model = null;
        let modelLoaded = false;

        loader.load(
            MODEL_PATH,
            (gltf) => {
                model = gltf.scene;
                modelLoaded = true;

                // Scale and position the model
                model.scale.set(1, 1, 1);
                model.position.set(0, 0, 0);

                // Enable shadows on all meshes
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // Optional: improve material quality
                        if (child.material) {
                            child.material.roughness = 0.7;
                            child.material.metalness = 0.1;
                        }
                    }
                });

                scene.add(model);

                // Hide loading screen
                loadingEl.classList.add('hidden');

                console.log('✅ Pizzeria loaded successfully!');
            },
            (xhr) => {
                // Progress
                const pct = Math.round((xhr.loaded / xhr.total) * 100);
                if (pct % 10 === 0) {
                    document.querySelector('#loading div:last-child').textContent =
                        `Loading... ${pct}%`;
                }
            },
            (error) => {
                console.error('❌ Error loading model:', error);
                loadingEl.innerHTML = `
                    <div style="color:#ff3333;font-size:48px;margin-bottom:20px;">⚠️</div>
                    <div style="color:#ff6b35;">Failed to load model</div>
                    <div style="font-size:14px;color:#888;margin-top:10px;max-width:400px;text-align:center;">
                        Make sure <strong>${MODEL_PATH}</strong> exists in the same folder as this HTML file.
                        <br><br>
                        Error: ${error.message || 'Unknown error'}
                    </div>
                `;
            }
        );

        // ----- Simple Collision (basic walls via raycasting) -----
        // This prevents walking through walls using a simple raycast check
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const moveState = { forward: false, backward: false, left: false, right: false };
        let isSprinting = false;

        // Keyboard input
        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveState.forward = true; e.preventDefault(); break;
                case 'KeyS': moveState.backward = true; e.preventDefault(); break;
                case 'KeyA': moveState.left = true; e.preventDefault(); break;
                case 'KeyD': moveState.right = true; e.preventDefault(); break;
                case 'ShiftLeft':
                case 'ShiftRight':
                    isSprinting = true;
                    e.preventDefault();
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveState.forward = false; e.preventDefault(); break;
                case 'KeyS': moveState.backward = false; e.preventDefault(); break;
                case 'KeyA': moveState.left = false; e.preventDefault(); break;
                case 'KeyD': moveState.right = false; e.preventDefault(); break;
                case 'ShiftLeft':
                case 'ShiftRight':
                    isSprinting = false;
                    e.preventDefault();
                    break;
            }
        });

        // Simple collision detection using raycasting
        function checkCollision(newPos) {
            if (!model) return false;

            // Raycast from player position in movement direction
            const raycaster = new THREE.Raycaster();
            const origin = new THREE.Vector3(
                camera.position.x,
                camera.position.y,
                camera.position.z
            );
            const dir = new THREE.Vector3()
                .copy(newPos)
                .sub(origin)
                .normalize();

            // Check distance we're trying to move
            const distance = origin.distanceTo(newPos);

            raycaster.set(origin, dir);

            // Get all meshes in the model
            const meshes = [];
            model.traverse((child) => {
                if (child.isMesh) {
                    meshes.push(child);
                }
            });

            const intersects = raycaster.intersectObjects(meshes);

            // If we hit something within the move distance, block movement
            for (const hit of intersects) {
                if (hit.distance < distance && hit.distance > 0.1) {
                    return true; // Collision!
                }
            }
            return false;
        }

        // ----- Window Resize -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- Animation Loop -----
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);

            // Movement (only when controls are locked)
            if (controls.isLocked && modelLoaded) {
                const speed = isSprinting ? 6.0 : 3.0;
                const moveAmount = speed * delta;

                // Get forward/right directions from camera
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3();
                right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                // Calculate desired movement
                const moveVec = new THREE.Vector3(0, 0, 0);
                if (moveState.forward) moveVec.add(forward);
                if (moveState.backward) moveVec.sub(forward);
                if (moveState.left) moveVec.sub(right);
                if (moveState.right) moveVec.add(right);

                if (moveVec.length() > 0) {
                    moveVec.normalize().multiplyScalar(moveAmount);

                    // Try X movement
                    const testX = camera.position.clone().add(new THREE.Vector3(moveVec.x, 0, 0));
                    if (!checkCollision(testX)) {
                        camera.position.x = testX.x;
                    }

                    // Try Z movement
                    const testZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveVec.z));
                    if (!checkCollision(testZ)) {
                        camera.position.z = testZ.z;
                    }

                    // Try Y movement (gravity - keep at eye height)
                    // You can adjust this if your model has floors at different heights
                    camera.position.y = 1.7;
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // ----- Optional: Console helper -----
        console.log('🎮 FNAF Pizzeria Walkaround');
        console.log('📁 Make sure your model is at:', MODEL_PATH);
        console.log('🖱️  Click the screen to lock your mouse and start walking!');
        console.log('⌨️  WASD to move · Shift to sprint');

        // If model fails to load after 10 seconds, show helpful message
        setTimeout(() => {
            if (!modelLoaded) {
                const msg = document.querySelector('#loading div:last-child');
                if (msg && !msg.textContent.includes('Failed')) {
                    msg.textContent = '⏳ Still loading... Check console for errors.';
                }
            }
        }, 10000);
    </script>
</body>
</html>
