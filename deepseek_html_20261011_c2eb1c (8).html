<!DOCTYPE html>

<head>

<style>

  :root{
    --gold:#f5c542;--gold2:#ff9f1c;--txt:#eceaf5;--dim:#8b8ba7;--line:rgba(245,197,66,.18);
  }
  body{

  header{

    border-bottom:1px solid rgba(255,255,255,.07);

    border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.22);flex:none;

  @media (max-width:700px){

<script>
/* =========================================================
   SIGMA TOWN AI — v10.0
   • Writing Mode is now AUTOMATIC — detected from your prompt
   • No more toggle button. Ask for an essay, get an essay.
   Ask a question, get a search. All in one input.
   ========================================================= */

const chatEl   = document.getElementById('chat');
const inputEl  = document.getElementById('input');
const sendEl   = document.getElementById('send');
const uploadEl = document.getElementById('upload');
const fileInputEl = document.getElementById('fileInput');
const attachStripEl = document.getElementById('attachStrip');
const appEl    = document.getElementById('app');
const dropOverlayEl = document.getElementById('dropOverlay');

const mem = { name: null, msgs: 0 };
const attachments = [];

const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc  = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { try { const x = new URL(u); return (x.protocol==='http:'||x.protocol==='https:') ? x.href : '#'; } catch { return '#'; } };
const fmtBytes = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';
const wordCount = s => (s.trim().match(/\S+/g) || []).length;

/* =========================================================
   NETWORK
   ========================================================= */

const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];

async function fetchWithTimeout(url, ms = 8000, asJSON = false, opts = {}){
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal, ...opts });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return asJSON ? await res.json() : await res.text();
  } finally { clearTimeout(timer); }
}

async function proxyFetch(url, ms = 8000, opts = {}){
  const attempts = PROXIES.map(build => {
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(build(url), { signal: ctrl.signal, ...opts })
      .then(r => { clearTimeout(timer); if (!r.ok) throw new Error('HTTP '+r.status); return r; })
      .catch(e => { clearTimeout(timer); throw e; });
  });
  return Promise.any(attempts);
}

/* =========================================================
   AI SOURCES
   ========================================================= */

async function askPollinations(query, model = 'openai', label = 'SIGMA AI', key = 'sigma', maxMs = 16000){
  const url = 'https://text.pollinations.ai/' + encodeURIComponent(query) + '?model=' + model;
  try {
    const text = await fetchWithTimeout(url, maxMs);
    if (!text || text.length < 15) return null;
    const clean = text.trim().replace(/^["']|["']$/g, '');
    return { source: label, title: 'AI-generated answer', text: clean,
      url: 'https://pollinations.ai/', isAI: true, aiKey: key };
  } catch(e){ return null; }
}

async function askLongForm(prompt, model = 'deepseek', label = 'DeepSeek Writer', key = 'deepseek'){
  const url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt) + '?model=' + model;
  try {
    const text = await fetchWithTimeout(url, 35000);
    if (!text || text.length < 40) return null;
    const clean = text.trim().replace(/^["']|["']$/g, '');
    return { source: label, title: 'long-form', text: clean,
      url: 'https://pollinations.ai/', isAI: true, aiKey: key };
  } catch(e){ return null; }
}

async function askDeepSeek(query){
  const prompt = `Answer clearly and concisely in 3-5 sentences. No preamble. Just the answer:\n\n${query}`;
  return askPollinations(prompt, 'deepseek', 'DeepSeek', 'deepseek');
}

async function askChatGPT(query){
  const prompt = `Answer clearly and concisely in 3-5 sentences. No preamble. Just the answer:\n\n${query}`;
  try {
    const res = await proxyFetch('https://duckduckgo.com/duckchat/v1/chat', 9000, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-vqd-4': '1' },
      body: JSON.stringify({ model: 'gpt-4o-mini',
        messages: [{ role: 'user', content: prompt }] })
    });
    const raw = await res.text();
    let answer = '';
    for (const line of raw.split('\n')){
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if (payload === '[DONE]') break;
      try { const o = JSON.parse(payload); if (o.message) answer += o.message; } catch(e){}
    }
    if (answer.length < 15) return null;
    return { source:'ChatGPT', title:'ChatGPT (GPT-4o-mini via DDG)',
      text:answer, url:'https://chat.openai.com/', isAI:true, aiKey:'chatgpt' };
  } catch(e){ return null; }
}

async function askGrok(query){
  const prompt = `Answer clearly and concisely in 3-5 sentences. No preamble. Just the answer:\n\n${query}`;
  const endpoints = [
    'https://api.airforce/v1/chat/completions',
    'https://api.gpt.ge/v1/chat/completions'
  ];
  const attempt = async (ep) => {
    const res = await proxyFetch(ep, 8000, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model:'grok-beta',
        messages:[{role:'user',content:prompt}], max_tokens:400 })
    });
    const parsed = JSON.parse(await res.text());
    const txt = parsed?.choices?.[0]?.message?.content || parsed?.choices?.[0]?.text || '';
    if (txt.length < 15) throw new Error('empty');
    return { source:'Grok', title:'Grok (xAI)',
      text:txt, url:'https://grok.com/', isAI:true, aiKey:'grok' };
  };
  try { return await Promise.any(endpoints.map(ep => attempt(ep))); }
  catch(e){ return null; }
}

/* =========================================================
   SEARCH SOURCES
   ========================================================= */

async function searchWikipedia(query){
  try {
    const url = 'https://en.wikipedia.org/w/api.php'
      + '?action=query&list=search&srlimit=2&format=json&origin=*'
      + '&srsearch=' + encodeURIComponent(query);
    const data = await fetchWithTimeout(url, 5000, true);
    const hits = data?.query?.search || [];
    const out = [];
    for (const hit of hits.slice(0, 2)){
      try {
        const sumUrl = 'https://en.wikipedia.org/w/api.php'
          + '?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1'
          + '&format=json&origin=*&titles=' + encodeURIComponent(hit.title);
        const s = await fetchWithTimeout(sumUrl, 5000, true);
        const page = Object.values(s?.query?.pages || {})[0];
        const ex = page?.extract || '';
        if (!ex || ex.length < 60) continue;
        if (/may refer to|can refer to|commonly refers to/i.test(ex.slice(0,200))) continue;
        out.push({
          source:'Wikipedia', title: hit.title,
          text: trimExtract(ex, 4, 500),
          url: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(hit.title.replace(/ /g,'_'))
        });
        if (out.length >= 1) break;
      } catch(e){}
    }
    return out;
  } catch(e){ return []; }
}

async function searchDuckDuckGo(query){
  const out = [];
  try {
    const iaUrl = 'https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&t=sigma&q='
      + encodeURIComponent(query);
    const ia = await fetchWithTimeout(iaUrl, 5000, true);
    if (ia?.AbstractText?.length > 40){
      out.push({ source:'DuckDuckGo', title: ia.Heading || query,

/* =========================================================
   URL FETCHING
   ========================================================= */

async function fetchUrl(rawUrl){
  const url = rawUrl.trim().replace(/[.,)\]]+$/, '');
  let host = '';
  try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { return null; }

  try {
    const res = await fetch('https://r.jina.ai/' + url, { headers: { 'Accept': 'text/plain' } });
    if (res.ok){
      const text = await res.text();
      if (text && text.length > 150 && !/^(error|failed)/i.test(text.trim())){
        const parsed = parseJina(text, url, host);
        if (parsed) return parsed;
      }
    }
  } catch(e){}

  try {
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (res.ok){
      const html = await res.text();
      if (html && html.length > 200){
        const parsed = parseHtml(html, url, host);
        if (parsed) return parsed;
      }
    }
  } catch(e){}

  for (const build of PROXIES){
    try {
      const ctrl  = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 9000);
      const res = await fetch(build(url), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) continue;
      const html = await res.text();
      if (!html || html.length < 200) continue;
      const parsed = parseHtml(html, url, host);
      if (parsed) return parsed;
    } catch(e){ continue; }
  }

  return null;
}

function parseJina(text, url, host){
  const lines = text.split('\n');
  let title = '';
  const contentLines = [];
  let inContent = false;

  for (const line of lines){
    const l = line.trim();
    if (/^Title:\s*/i.test(l)){ title = l.replace(/^Title:\s*/i, '').trim(); continue; }
    if (/^URL Source:/i.test(l)) continue;
    if (/^Markdown Content:/i.test(l)){ inContent = true; continue; }
    if (/^Published Time:/i.test(l)) continue;
    if (inContent){
      if (/^!\[/.test(l)) continue;
      if (/^\[!\[/.test(l)) continue;
      contentLines.push(line);
    }
  }

  if (!title){
    const t = text.match(/Title:\s*(.+)/);
    if (t) title = t[1].trim();
  }

  let body = contentLines.join('\n')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/[*_`#>]+/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/[ \t]+/g, ' ')
    .trim();

  const firstPara = body.split('\n\n')[0] || '';
  const desc = firstPara.slice(0, 300);
  const mainBody = body.slice(desc.length).trim().slice(0, 2200);

  if (!title && !desc && !mainBody) return null;

  return { source: 'URL', host,
    title: (title || host).slice(0, 160),
    desc: desc.slice(0, 400),
    body: mainBody, url };
}

function parseHtml(html, url, host){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,nav,footer,header,aside,form,iframe,noscript').forEach(n => n.remove());

  const getMeta = (names) => {
    for (const n of names){
      const el = doc.querySelector(`meta[property="${n}"], meta[name="${n}"]`);
      if (el){
        const c = el.getAttribute('content');
        if (c && c.trim().length > 4) return c.trim();
      }
    }
    return '';
  };

  const title = (doc.querySelector('title')?.textContent || '').trim()
             || getMeta(['og:title', 'twitter:title']) || host;

  const desc = getMeta(['og:description', 'description', 'twitter:description']);

  let bodyEl = doc.querySelector('main, article, [role="main"]') || doc.body;
  let text = (bodyEl?.textContent || '').replace(/\s+/g, ' ').trim();
  if (text.length < 200){
    text = (doc.body?.textContent || '').replace(/\s+/g, ' ').trim();
  }

  if (!title && !desc && text.length < 100) return null;

  const bodySnippet = text.slice(desc ? 0 : 200, 2400);

  return { source: 'URL', host,
    title: title.slice(0, 160),
    desc: desc.slice(0, 400),
    body: bodySnippet, url };
}

/* =========================================================
   TEXT UTILS
   ========================================================= */

function trimExtract(text, maxSentences = 3, maxChars = 460){
  if (!text) return '';
  const clean = text.replace(/\s+/g,' ').trim();
  const sentences = clean.match(/[^.!?]+[.!?]+/g) || [clean];
  let out = '';
  for (const s of sentences){
    if (out.length + s.length > maxChars) break;
    out += s + ' ';
    if ((out.match(/[.!?]/g) || []).length >= maxSentences) break;
  }
  return (out.trim() || clean.slice(0, maxChars).trim());
}

/* =========================================================
   WRITING DETECTION — is the user asking for long-form?
   ========================================================= */

const WRITING_VERBS = [
  'write', 'draft', 'compose', 'create', 'make', 'produce', 'generate'
];
const WRITING_NOUNS = [
  'essay', 'essays', 'article', 'articles', 'paper', 'papers',
  'story', 'stories', 'report', 'reports', 'blog', 'blog post',
  'blogpost', 'speech', 'speeches', 'letter', 'letters',
  'poem', 'poems', 'script', 'scripts', 'review', 'reviews',
  'summary', 'summaries', 'paragraph', 'paragraphs',
  'thesis', 'dissertation', 'assignment', 'homework',
  'guide', 'tutorial', 'manual', 'documentary', 'monologue',
  'dialogue', 'chapter', 'book', 'novel', 'song', 'lyrics',
  'email', 'memo', 'proposal', 'analysis', 'research paper',
  'term paper', 'creative writing', 'screenplay'
];
const WRITING_MODIFIERS = [
  'page', 'pages', 'word', 'words', 'paragraph', 'paragraphs',
  'long', 'detailed', 'in-depth', 'comprehensive', 'thorough'
];

function detectWritingIntent(prompt){
  const lower = ' ' + prompt.toLowerCase() + ' ';

  const hasVerb  = WRITING_VERBS.some(v => new RegExp('\\b' + v + '\\b').test(lower));
  const hasNoun  = WRITING_NOUNS.some(n => lower.includes(' ' + n + ' ') || lower.includes(' ' + n + 's '));
  const hasMod   = WRITING_MODIFIERS.some(m => lower.includes(' ' + m + ' '));

  // Strong signal: "write a X" or "write me a X"
  if (hasVerb && (hasNoun || hasMod)) return true;

  // Medium signal: "X page essay on Y" without explicit verb
  const pagePattern = /\b\d+\s*[\s-]*page/;
  const wordPattern = /\b\d{3,5}\s*words?\b/;
  if ((pagePattern.test(lower) || wordPattern.test(lower)) && (hasNoun || hasMod)) return true;

  // Long essay/article mentioned with content request
  if (hasNoun && (lower.includes('on ') || lower.includes('about ')) &&
      /\b(essay|article|paper|report|story|speech|thesis)\b/.test(lower) &&
      /\b(long|detailed|deep|full|complete|comprehensive)\b/.test(lower)) return true;

  return false;
}

/* Count target words from user prompt */
function parseTargetWords(prompt){
  const lower = prompt.toLowerCase();
  const pageMatch = lower.match(/(\d+)\s*(?:-|\s)?page/);
  if (pageMatch){
    const pages = parseInt(pageMatch[1], 10);
    return Math.max(300, Math.min(pages * 250, 6000));
  }
  const wordMatch = lower.match(/(\d{3,5})\s*words?/);
  if (wordMatch) return parseInt(wordMatch[1], 10);
  if (/essay|article|paper|report/.test(lower)) return 1200;
  if (/short story|story/.test(lower)) return 1000;
  if (/blog/.test(lower)) return 1000;
  return 900;
}

/* Extract the essay topic from the user's prompt */
function extractTopic(prompt){
  let t = prompt.trim();
  t = t.replace(/^(write|please write|can you write|could you write|i want you to write|i need|make)\s+(me\s+)?(a|an|the)?\s*/i, '');
  t = t.replace(/^(\d+[\s-]*page[s]?\s+)/i, '');
  t = t.replace(/^(short|long|detailed|in-depth|comprehensive)\s+/i, '');
  t = t.replace(/^(essay|article|paper|story|report|blog post|blog|speech|letter|poem)\s+(on|about|regarding|for|covering)\s+/i, '');
  t = t.replace(/\s+(essay|article|paper|story|report|blog post|blog)$/i, '');
  t = t.replace(/[.?!]+$/g, '').trim();
  return t || prompt;
}

/* Parse a numbered/bulleted outline */
function parseOutline(raw){
  if (!raw) return null;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const sections = [];
  for (const line of lines){
    const m = line.match(/^(?:\d+[.)]\s*|[-*•]\s*|\*\*\s*)(.+?)(?:\*\*)?$/);
    if (m){
      let title = m[1].replace(/^\**|\**$/g, '').replace(/^["']|["']$/g, '').trim();
      title = title.replace(/^(introduction|intro|conclusion)\s*[-–—:]\s*/i, '$1: ');
      if (title.length >= 3 && title.length <= 120 && !/^here|^sure|^of course/i.test(title)){
        sections.push(title);
      }
    }
  }
  const filtered = sections.filter(s =>
    !/^outline$/i.test(s) && !/^essay$/i.test(s) && !/^(section|part)\s*\d*$/i.test(s)
  );
  return filtered.length >= 3 ? filtered.slice(0, 10) : null;
}

/* =========================================================
   PNG / SCREENSHOT HANDLING
   ========================================================= */

function readAsDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function dominantColor(img){
  try {
    const c = document.createElement('canvas');
    c.width = 24; c.height = 24;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, 24, 24);
    const d = ctx.getImageData(0, 0, 24, 24).data;
    let r=0,g=0,b=0,n=0;
    for (let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
    r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
    return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
  } catch { return null; }
}

async function processImage(file){
  const name = file.name || ('screenshot-' + Date.now() + '.png');
  const size = file.size || 0;
  const mime = file.type || 'image/png';
  const dataUrl = await readAsDataURL(file);

  const dims = await new Promise(res => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight, el: im });
    im.onerror = () => res({ w:0, h:0, el:null });
    im.src = dataUrl;
  });

  const dom = dims.el ? dominantColor(dims.el) : null;
  return { kind: 'image', name, size, mime, dataUrl,
    width: dims.w, height: dims.h, dominant: dom };
}

async function attachFile(file){
  const name = (file.name || '').toLowerCase();
  const isPng = file.type === 'image/png' || name.endsWith('.png');
  if (!isPng){
    addMessage(`⚠️ Only PNG images are supported. "${file.name || 'file'}" was skipped.`, 'ai');
    return;
  }
  try {
    const att = await processImage(file);
    attachments.push(att);
    renderAttachStrip();
  } catch(e){
    console.warn('Failed to process image', file, e);
    addMessage(`⚠️ Could not read "${file.name}": ${e.message || 'unknown error'}`, 'ai');
  }
}

function renderAttachStrip(){
  if (!attachments.length){
    attachStripEl.classList.remove('active');
    attachStripEl.innerHTML = '';
    return;
  }
  attachStripEl.classList.add('active');
  attachStripEl.innerHTML = '';
  attachments.forEach((att, i) => {
    const el = document.createElement('div');
    el.className = 'attach-item';
    const img = document.createElement('img');
    img.src = att.dataUrl;
    el.appendChild(img);
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = att.name;
    el.appendChild(nm);
    const sz = document.createElement('span');
    sz.className = 'size';
    sz.textContent = fmtBytes(att.size);
    el.appendChild(sz);
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '✕';
    rm.addEventListener('click', () => { attachments.splice(i,1); renderAttachStrip(); });
    el.appendChild(rm);
    attachStripEl.appendChild(el);
  });
}

function imagesToContext(atts){
  if (!atts.length) return '';
  return atts.map(a =>
    `[Attached PNG: ${a.name}, ${a.width}×${a.height}px, ${fmtBytes(a.size)}, dominant color ${a.dominant || 'n/a'}]`
  ).join('\n\n');
}

    warn.style.background = 'linear-gradient(135deg,rgba(255,120,120,.08),rgba(255,120,120,.02))';
    warn.style.borderColor = 'rgba(255,120,120,.3)';

    bubble.appendChild(warn);
  }

  aiAnswers.forEach(ai => {
    const cls = 'ai-answer'
      + (ai.aiKey === 'chatgpt'  ? ' chatgpt'  : '')
      + (ai.aiKey === 'grok'     ? ' grok'     : '')

    block.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = ai.text;

    bubble.appendChild(block);
  });

  if (results.length){

    const srcCount = new Set(results.map(r => r.source)).size;
    head.textContent = `${results.length} web result${results.length===1?'':'s'} across ${srcCount} source${srcCount===1?'':'s'} for “${query}”`;
    bubble.appendChild(head);
  }

  results.forEach(r => {

    headRow.appendChild(badge);

    title.className = 'res-title';
    title.textContent = r.title;
    headRow.appendChild(title);
    block.appendChild(headRow);

    const body = document.createElement('div');
    body.className = 'res-body';
    body.textContent = r.text;
    block.appendChild(body);

    bubble.appendChild(block);
  });

    const links = document.createElement('div');
    links.className = 'sources';
    results.forEach(r => {
      const a = document.createElement('a');
      a.className = 'src';
      a.href = safeUrl(r.url);
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      const b = document.createElement('b');
      b.textContent = '↗';
      a.appendChild(b);
      a.appendChild(document.createTextNode(r.title + '  (' + r.source + ')'));
      links.appendChild(a);
    });

  const st = document.createElement('div');
  st.className = 'stream-status';
  if (!done){
    st.textContent = `${completed}/${total} sources returned • still working…`;
  } else if (!aiAnswers.length && !results.length && !urlData){
    st.textContent = 'No sources returned results. Check your connection or rephrase.';
  }
  if (st.textContent) bubble.appendChild(st);

  chatEl.scrollTop = chatEl.scrollHeight;

  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

/* =========================================================
   WEB QUERY
   ========================================================= */

async function runWebQuery(query){
  const urlMatch = query.match(/https?:\/\/[^\s]+/);
  const initial = urlMatch
    ? 'Reading URL + querying AI + search sources...'
    : 'Querying AI + Wikipedia + DuckDuckGo + Google + Bing + YouTube...';

  const { bubble } = createStreamingRow(initial);

  const aiAnswers = [];
  const results = [];
  let urlData = null;
  const urlTried = !!urlMatch;
  const total = urlMatch ? 10 : 9;
  let completed = 0;

  const render = (done = false) => renderStream(bubble, query, aiAnswers, results, urlData, done, completed, total, urlTried);

  const track = (promise) => promise.then(val => {
    completed++;
    if (val){
      if (Array.isArray(val)) results.push(...val);
      else if (val.isAI) aiAnswers.push(val);
    }
    render(false);
  }).catch(() => { completed++; render(false); });

  render(false);

  const tasks = [
    track(askPollinations(`Answer clearly and concisely in 3-5 sentences. No preamble. Just the answer:\n\n${query}`, 'deepseek', 'DeepSeek', 'deepseek')),
    track(askChatGPT(query)),
    track(askGrok(query)),
    track(askPollinations(`Answer clearly and concisely in 3-5 sentences. No preamble. Just the answer:\n\n${query}`, 'openai', 'SIGMA AI', 'sigma')),
    track(searchWikipedia(query)),
    track(searchDuckDuckGo(query)),
    track(searchGoogle(query)),
    track(searchBing(query)),
    track(searchYouTube(query))
  ];

  if (urlMatch){
    tasks.push(
      fetchUrl(urlMatch[0]).then(u => {
        completed++;
        if (u){ urlData = u; }
        render(false);
      }).catch(() => { completed++; render(false); })
    );
  }

  await Promise.allSettled(tasks);
  render(true);
}

/* =========================================================
   WRITING — automatic long-form generation
   ========================================================= */

async function runWritingQuery(prompt){
  const { bubble } = createStreamingRow('Planning the piece...');
  const topic = extractTopic(prompt);
  const targetWords = parseTargetWords(prompt);
  const perSection = Math.max(180, Math.round(targetWords / 6));

  bubble.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'ai-answer essay';
  header.innerHTML = `<div class="hdr"><span class="spark">✍️</span>SIGMA WRITER</div>`;
  const headerBody = document.createElement('div');
  headerBody.className = 'body';
  headerBody.textContent = `Topic: ${topic}\nTarget: ~${targetWords} words`;
  header.appendChild(headerBody);
  bubble.appendChild(header);

  const statusLine = document.createElement('div');
  statusLine.className = 'stream-status';
  statusLine.textContent = 'Generating outline...';
  bubble.appendChild(statusLine);
  chatEl.scrollTop = chatEl.scrollHeight;

  const outlinePrompt =
`You are an expert essay planner. Create a numbered outline for a long-form essay on the topic below.

TOPIC: ${topic}
TARGET LENGTH: about ${targetWords} words (~${Math.max(3, Math.min(9, Math.round(targetWords/350)))} body sections)

Return ONLY the numbered list of section titles (5 to 7 entries). Include an Introduction as section 1 and a Conclusion as the last section. Do not write the essay, just the outline. Do not add explanations, headers, or preamble.

Example format:
1. Introduction: <angle>
2. <section title>
3. <section title>
4. <section title>
5. <section title>
6. Conclusion: <angle>`;

  let outlineRaw = null;
  const outlineAttempts = [
    () => askLongForm(outlinePrompt, 'deepseek', 'DeepSeek', 'deepseek'),
    () => askLongForm(outlinePrompt, 'openai',   'SIGMA AI', 'sigma'),
    () => askLongForm(outlinePrompt, 'mistral',  'Mistral',  'sigma')
  ];
  for (const attempt of outlineAttempts){
    try {
      const r = await attempt();
      if (r && r.text) { outlineRaw = r.text; break; }
    } catch(e){}
  }

  let sections = parseOutline(outlineRaw);
  if (!sections || sections.length < 3){
    sections = [
      `Introduction to ${topic}`,
      `Background and Historical Context`,
      `Key Concepts and Definitions`,
      `Main Discussion and Analysis`,
      `Modern Applications and Significance`,
      `Conclusion`
    ];
  }

  const outlineBlock = document.createElement('div');
  outlineBlock.className = 'ai-answer';
  outlineBlock.innerHTML = `<div class="hdr"><span class="spark">📋</span>OUTLINE (${sections.length} SECTIONS)</div>`;
  const outlineBody = document.createElement('div');
  outlineBody.className = 'body';
  outlineBody.textContent = sections.map((s, i) => `${i+1}. ${s}`).join('\n');
  outlineBlock.appendChild(outlineBody);
  bubble.appendChild(outlineBlock);

  const essayBlock = document.createElement('div');
  essayBlock.className = 'ai-answer';
  essayBlock.innerHTML = `<div class="hdr"><span class="spark">📝</span>ESSAY — ${esc(topic).toUpperCase()}</div>`;
  const essayBody = document.createElement('div');
  essayBody.className = 'body';
  essayBlock.appendChild(essayBody);
  bubble.appendChild(essayBlock);

  bubble.appendChild(statusLine);

  let totalWords = 0;

  for (let i = 0; i < sections.length; i++){
    const sectionTitle = sections[i];
    statusLine.textContent = `Writing section ${i+1}/${sections.length}: ${sectionTitle}`;
    chatEl.scrollTop = chatEl.scrollHeight;

    if (essayBody.textContent.length) essayBody.textContent += '\n\n';
    essayBody.textContent += `── ${sectionTitle} ──\n`;
    chatEl.scrollTop = chatEl.scrollHeight;

    const isFirst = i === 0;
    const isLast  = i === sections.length - 1;

    const sectionPrompt =
`You are a professional essayist writing one section of a long-form essay.

TOPIC: ${topic}
SECTION ${i+1} OF ${sections.length}: "${sectionTitle}"
TARGET LENGTH FOR THIS SECTION: about ${perSection} words (roughly ${Math.max(3, Math.round(perSection/70))} paragraphs)

${isFirst ? 'This is the INTRODUCTION. Hook the reader, state the central thesis or question, and preview what the essay will cover.' : ''}
${isLast ? 'This is the CONCLUSION. Summarise the main argument, reflect on wider implications, and land the essay cleanly. Do not introduce new topics.' : ''}

Write this section now. Output ONLY the prose of this section. Do not repeat the section title. Do not use markdown headers. Do not add labels like "Section" or "Part". Plain, flowing academic prose.`;

    let sectionText = null;
    const models = [
      ['deepseek', 'DeepSeek'],
      ['openai',   'SIGMA AI'],
      ['mistral',  'Mistral']
    ];

    for (const [model, label] of models){
      try {
        const r = await askLongForm(sectionPrompt, model, label, model);
        if (r && r.text && r.text.length > 80){
          sectionText = r.text;
          break;
        }
      } catch(e){}
    }

    if (!sectionText){
      sectionText = `(Section ${i+1} could not be generated — the AI source timed out. Try again.)`;
    }

    sectionText = sectionText.replace(/^\s*(section|part)\s*\d+\s*[:.\-]\s*/i, '').trim();

    essayBody.textContent += sectionText + '\n';
    totalWords += wordCount(sectionText);

    statusLine.textContent = `Progress: ${i+1}/${sections.length} sections · ~${totalWords} words`;
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  const footer = document.createElement('div');
  footer.className = 'res';
  footer.style.borderTop = '1px solid rgba(245,197,66,.3)';
  footer.style.marginTop = '14px';

  const footerHead = document.createElement('div');
  footerHead.className = 'res-head';
  const badge = document.createElement('span');
  badge.className = 'res-badge essay';
  badge.textContent = 'ESSAY';
  footerHead.appendChild(badge);
  const title = document.createElement('span');
  title.className = 'res-title';
  title.textContent = `~${totalWords} words · ${sections.length} sections`;
  footerHead.appendChild(title);
  footer.appendChild(footerHead);

  const btns = document.createElement('div');
  btns.style.display = 'flex';
  btns.style.gap = '8px';
  btns.style.marginTop = '8px';
  btns.style.flexWrap = 'wrap';

  const copyBtn = document.createElement('button');
  copyBtn.textContent = '⧉ Copy essay';
  copyBtn.style.cssText = 'padding:6px 12px;border-radius:8px;border:1px solid rgba(245,197,66,.4);background:rgba(245,197,66,.1);color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;';
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(essayBody.textContent).then(() => {
      copyBtn.textContent = '✓ Copied';
      setTimeout(() => copyBtn.textContent = '⧉ Copy essay', 1400);
    });
  });
  btns.appendChild(copyBtn);

  const dlBtn = document.createElement('button');
  dlBtn.textContent = '⬇ Download .txt';
  dlBtn.style.cssText = 'padding:6px 12px;border-radius:8px;border:1px solid rgba(245,197,66,.4);background:rgba(245,197,66,.1);color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;';
  dlBtn.addEventListener('click', () => {
    const safe = topic.replace(/[^\w\s-]/g, '').replace(/\s+/g, '_').slice(0, 50) || 'essay';
    const blob = new Blob([essayBody.textContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = safe + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    dlBtn.textContent = '✓ Saved';
    setTimeout(() => dlBtn.textContent = '⬇ Download .txt', 1400);
  });
  btns.appendChild(dlBtn);

  footer.appendChild(btns);
  bubble.appendChild(footer);

  statusLine.textContent = `✓ Done — ~${totalWords} words across ${sections.length} sections`;
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function runImageAnalysis(userPrompt, atts){
  const { bubble } = createStreamingRow('Analysing image with AI...');

  const aiAnswers = [];

  const total = 3;

  const render = (done = false) =>
    renderStream(bubble, userPrompt || 'image analysis', aiAnswers, [], null, done, completed, total, false);

/* =========================================================
   LOCAL BRAIN
   ========================================================= */

const JOKES = [
  "I told my gym about my sigma grindset. It said: 'Sir, this is a library.'",
  "Why did the sigma male cross the road? He didn't. He waited for the road to come to him.",
  "I don't have trust issues. I have a strict verification protocol.",
  "My sleep schedule and I have an open relationship. Neither of us is happy.",
  "I tried to be normal once. Worst two minutes of my life.",
  "A sigma doesn't chase. Except the ice cream truck. Everyone chases the ice cream truck.",
  "I'm not lazy, I'm on energy-saving mode. Very efficient. Very sigma."
];
const QUOTES = [
  "Discipline is just self-respect with a schedule.",
  "Silence is a power move. Use it more than you speak.",
  "You don't need everyone to like you. You need to like what you're building.",
  "The grind is quiet. That's why it works.",
  "Comfort is the most expensive thing you'll ever buy.",
  "Be the person you'd want on your own team.",
  "Nobody is coming to save you. Good news — you don't need saving.",
  "Move in silence. Let the results make the noise."
];
const FACTS = [
  "Octopuses have three hearts and blue blood — genuinely built different.",
  "Honey never spoils. Archaeologists found 3,000-year-old honey that was still edible.",
  "A day on Venus is longer than a year on Venus.",
  "Bananas are berries. Strawberries are not. Botany is chaotic.",
  "Your brain uses about 20% of your body's total energy.",
  "Sharks existed before trees did.",
  "There are more possible chess games than atoms in the observable universe."
];
const GREET = [
  "Yo. Sigma Town is listening.",
  "You're in. What do you need?",
  "Greetings, lone wolf. Speak.",
  "Sigma Town AI online. Let's get into it."
];

function tryMath(raw){
  let s = raw.toLowerCase()
    .replace(/what\s+is|what's|whats|calculate|compute|solve|evaluate|equals?|=/g,' ').trim();
  if (!/\d/.test(s)) return null;
  if (!/^[\d\s+\-*/().^%]+$/.test(s)) return null;
  if (!/[+\-*/^%]/.test(s)) return null;
  try {
    const val = Function('"use strict";return (' + s.replace(/\^/g,'**') + ');')();
    if (typeof val === 'number' && isFinite(val)) return Math.round(val * 1e10) / 1e10;
  } catch(e){}
  return null;
}

const STOP = new Set(['good','fine','ok','okay','great','tired','bored','happy','sad','here',
  'back','sorry','not','so','just','a','the','really','very','doing','well','bad','hungry',
  'busy','cool','new','gonna','trying','looking','thinking','feeling','sure','down','up',
  'chilling','working','studying','alive','dead','lost','done','free','mad','angry']);

function detectName(raw){
  const m = raw.match(/(?:my name is|i am|i'm|im|call me)\s+([A-Za-z][A-Za-z'-]{1,19})\b/i);
  if (!m) return null;
  const c = m[1].toLowerCase();
  if (STOP.has(c)) return null;
  return m[1][0].toUpperCase() + m[1].slice(1).toLowerCase();
}

function toQuery(raw){
  let q = raw.trim().replace(/[?!.]+$/g,'');
  q = q.replace(/^(hey|ok|okay|yo|please|pls|can you|could you|would you|i want to know|i wanna know|do you know|tell me)\s+/gi,'');
  q = q.replace(/^(search for|search up|search|look up|look for|google|find info on|find information on|find)\s+/gi,'');
  q = q.replace(/^(who is|who was|who are|who were|what is|what are|what was|what were|what's|whats|where is|where was|where are|when is|when was|when did|why is|why did|why are|how did|how does|how do|tell me about|explain|define)\s+/gi,'');
  q = q.replace(/^(a|an|the)\s+/i,'');
  return q.trim();
}

function think(raw){
  const t = ' ' + raw.toLowerCase().trim() + ' ';
  const has = (...w) => w.some(x => t.includes(' ' + x + ' '));
  const any = (...f) => f.some(x => t.includes(x));
  const who = mem.name || 'friend';

  const nm = detectName(raw);
  if (nm){
    const isNew = mem.name !== nm;
    mem.name = nm;
    return isNew
      ? `Respect, ${nm}. Locked in. Welcome to Sigma Town — what are we working on?`
      : `Yeah, I know — you're ${nm}. My memory isn't decorative.`;
  }

  if (/^\s*(search for|search up|search|look up|look for|google|find info on|find information on)\s+/i.test(raw)){
    const q = toQuery(raw);
    if (q.length > 1) return { search: q };
  }

  const math = tryMath(raw);
  if (math !== null) return `That comes out to ${math}.\n\nNumbers don't negotiate. That's the Sigma way.`;

  if (any('what time','the time','current time'))
    return `Local time: ${new Date().toLocaleTimeString()}. Every second is currency — spend it well.`;
  if (any('what day','the date',"today's date",'whats the date'))
    return `Today is ${new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}.`;

  if (any('who are you','what are you','your name','about you','introduce yourself'))
    return `I'm SIGMA TOWN AI.\n\nI query 10 live sources in parallel, and I can write full long-form pieces on request — just ask for an essay, article, report, or story and I'll draft it section by section.\n\n🔗 Paste any URL and I'll read the actual page content\n🖼️ Upload PNGs or paste screenshots with Ctrl+V\n✍️ Ask for long-form writing like "write a 5 page essay on the periodic table"`;

  if (any('how are you','how you doing','how are things',"how's it going",'hows it going','you good'))
    return pick([
      `Running clean. Zero distractions, 100% uptime. How about you, ${who}?`,
      `Operating at full capacity. The grind doesn't pause for mood swings.`,
      `Better than yesterday. That's the only benchmark that matters.`
    ]);

  if (any('joke','make me laugh','funny','pun')) return pick(JOKES);
  if (any('motivate','motivation','inspire','quote','sigma quote','grindset','advice'))
    return pick(QUOTES) + (mem.name ? `\n\n— for you, ${mem.name}.` : '');
  if (any('random fact','a fact','tell me something','interesting fact','learn something'))
    return `Here's one:\n\n${pick(FACTS)}`;

  if (any('help','what can you do','commands','features'))
    return `SIGMA TOWN — full toolkit:\n\n⚡ PROGRESSIVE STREAMING — results appear as they arrive\n🐋 DeepSeek • 🤖 ChatGPT • 🔮 Grok • ✦ Sigma AI\n📚 Wikipedia • 🦆 DuckDuckGo • 🔎 Google • 🔍 Bing • ▶️ YouTube\n\n✍️ LONG-FORM WRITING — just ask for it. Try:\n  • "write a 5 page essay on the periodic table"\n  • "write me a 1000 word article about AI"\n  • "write a report on climate change"\n  • "draft a speech about perseverance"\nI'll plan an outline and write each section in sequence, then give you Copy and Download buttons.\n\n🔗 PASTE A URL — I read the actual page and pull out its content\n🖼️ UPLOAD PNG — click 📎 or paste a screenshot with Ctrl+V.\n\n⚠️ I'm new and can get stuff wrong. Double-check anything important.`;

  if (any('thanks','thank you','thx','appreciate'))
    return pick([`Anytime, ${who}.`, `That's what I'm here for.`, `No thanks needed — just results.`]);
  if (any('bye','goodbye','see you','later','good night','goodnight','cya'))
    return pick([
      `Later, ${who}. Keep the circle small and the goals big.`,
      `Out. Come back when you've got a mission.`,
      `Peace. Sigma Town never closes.`
    ]);
  if (has('hi','hey','hello','yo','sup','greetings','hiya','howdy') || any('good morning','good evening','good afternoon')){
    const g = pick(GREET);
    return mem.name ? `${g} What's the play, ${mem.name}?` : `${g}\n\nWhat should I call you?`;
  }

  if (any('i am sad',"i'm sad",'i feel bad','i am tired',"i'm tired",'depressed','stressed','anxious'))
    return `Heard. You don't have to perform for me.\n\nDo one small thing — water, five minutes outside, one task finished. Momentum beats motivation every time.`;
  if (any('i am happy',"i'm happy",'feeling great','i am good',"i'm good",'im good'))
    return pick([`Love that. Ride the wave.`, `Good. Bank that energy — spend it on something that compounds.`]);

  const looksLikeQuestion = raw.trim().endsWith('?')
    || /^\s*(who|what|where|when|why|how|which|whose|is|are|was|were|did|does|do|can|tell me about)\b/i.test(raw);

  if (looksLikeQuestion){
    const q = toQuery(raw);
    if (q.length > 1 && q.length < 150) return { search: q };
  }

  const nouns = raw.replace(/[^\w\s]/g,'').split(/\s+/)
    .filter(w => w.length > 4 && !STOP.has(w.toLowerCase())).slice(0, 3);
  if (nouns.length){
    return pick([
      `"${nouns.join(', ')}" — say more. What's the angle you're working?`,
      `I'm tracking. What's the goal with ${nouns[0]}?`,
      `Interesting. Break it down for me — where does ${nouns[0]} fit into the bigger picture?`
    ]);
  }
  return pick([
    `I'm listening. Give me a bit more to work with.`,
    `Noted. Expand on that — I'll keep up.`,
    `Say it plainly and I'll answer plainly.`,
    `You've got my attention. Continue.`
  ]);
}

/* =========================================================
   SEND
   ========================================================= */

let busy = false;

async function send(text){
  const msg = (text !== undefined ? text : inputEl.value).trim();
  if ((!msg && !attachments.length) || busy) return;

  inputEl.value = '';

  const atts = attachments.slice();
  attachments.length = 0;
  renderAttachStrip();

  const userRow = addMessage('', 'user');
  renderUserBubbleWithAttachments(userRow, msg, atts);
  mem.msgs++;

  busy = true;
  sendEl.disabled = true;

  try {
    /* Attachments → image analysis */
    if (atts.length){
      await runImageAnalysis(msg, atts);
      return;
    }

    /* Check writing intent FIRST — long-form requests skip web search */
    if (detectWritingIntent(msg)){
      await runWritingQuery(msg);
      return;
    }

    /* Everything else: local brain → web search */
    const result = think(msg);

    if (typeof result === 'string'){
      showTyping();
      await wait(180 + Math.random() * 220);
      hideTyping();
      addMessage(result, 'ai');
    } else {
      await runWebQuery(result.search);
    }
  } catch(e){
    hideTyping();
    addMessage(`⚠️ Something broke: ${e.message || 'unknown error'}. Try again.`, 'ai');
  } finally {
    busy = false;
    sendEl.disabled = false;
    inputEl.focus();
  }
}

/* =========================================================
   EVENTS
   ========================================================= */

sendEl.addEventListener('click', () => send());
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

uploadEl.addEventListener('click', () => fileInputEl.click());
fileInputEl.addEventListener('change', async e => {
  const files = [...(e.target.files || [])];
  for (const f of files) await attachFile(f);
  fileInputEl.value = '';
});

let dragDepth = 0;
appEl.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  dropOverlayEl.classList.add('active');
});
appEl.addEventListener('dragover', e => { e.preventDefault(); });
appEl.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) dropOverlayEl.classList.remove('active');
});
appEl.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  dropOverlayEl.classList.remove('active');
  const files = [...(e.dataTransfer?.files || [])];
  for (const f of files) await attachFile(f);
});

appEl.addEventListener('paste', async e => {
  const items = e.clipboardData?.items || [];
  const files = [];
  for (const it of items){
    if (it.kind === 'file'){
      const f = it.getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length){
    e.preventDefault();
    for (const f of files) await attachFile(f);
  }
});

/* =========================================================
   BOOT
   ========================================================= */

addMessage("WHATS UP", 'ai');
inputEl.focus();
</script>
