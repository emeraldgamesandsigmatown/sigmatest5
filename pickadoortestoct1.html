<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick a Door — Lobby</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#06070d;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e9edff}
  canvas{display:block}
  #overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;cursor:pointer;
    background:radial-gradient(circle at 50% 42%,#141a30 0%,#06070d 72%);transition:opacity .7s ease}
  #overlay h1{font-size:clamp(34px,8vw,96px);letter-spacing:.2em;text-indent:.2em;font-weight:800;
    background:linear-gradient(180deg,#ffffff,#7f93ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #overlay p{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#6e7cab}
  #overlay.ready p{color:#9db0ff;animation:pulse 1.6s ease-in-out infinite}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay.error p{color:#ff8080;letter-spacing:.1em;text-transform:none}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  #crosshair{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
    z-index:6;pointer-events:none;opacity:0;transition:opacity .3s ease}
  #crosshair.show{opacity:.7}
  #crosshair.hot::before,#crosshair.hot::after{background:#ffd27f;box-shadow:0 0 8px #ffd27f}
  #crosshair.jumpscare{opacity:0 !important}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:#dfe6ff;box-shadow:0 0 6px #000}
  #crosshair::before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
  #crosshair::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
  #hud{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);
    z-index:10;pointer-events:none;text-align:center;white-space:nowrap;
    font-size:clamp(12px,1.6vw,17px);letter-spacing:.22em;text-transform:uppercase;
    font-weight:700;text-shadow:0 4px 24px #000;opacity:0;transition:opacity .3s ease}
  #hud.show{opacity:1}
  #hud .hint{color:#ffd27f}
  #hud .blue{color:#7fa5ff}
  #hud .red{color:#ff7f7f}
  #hud .green{color:#9dffa8}
  #hud .purple{color:#c48cff}
  #hud .kbd{display:inline-block;padding:1px 8px;border:1px solid #6a5a2a;
    border-radius:4px;background:#2a2210;color:#ffe9a8;font-size:.9em}
  #captions{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
    z-index:11;pointer-events:none;max-width:min(88vw,860px);
    padding:10px 22px;border-radius:12px;background:rgba(6,8,16,.72);
    border:1px solid rgba(150,170,255,.18);
    font-size:clamp(15px,2.1vw,24px);line-height:1.35;
    text-align:center;font-weight:600;color:#eef2ff;text-shadow:0 2px 12px #000;
    letter-spacing:.02em;opacity:0;transition:opacity .3s ease}
  #captions.show{opacity:1}
  #captions b{color:#9db0ff;font-weight:800}
  #controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    z-index:10;pointer-events:none;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:#6e7cab;text-shadow:0 2px 10px #000;
    opacity:0;transition:opacity .3s ease}
  #controls.show{opacity:.9}
  #fadeout{position:fixed;inset:0;background:#000;z-index:100;
    pointer-events:none;opacity:0;transition:opacity .45s ease}
  #fadeout.on{opacity:1}
  #jumpscareBlack{position:fixed;inset:0;background:#000;z-index:90;
    pointer-events:none;opacity:0;transition:opacity .08s ease}
  #jumpscareBlack.show{opacity:1}
  #doorIntro{position:fixed;inset:0;z-index:70;
    display:none;flex-direction:column;align-items:center;justify-content:space-between;
    gap:26px;padding:40px;background:transparent;opacity:0;transition:opacity .35s ease;
    pointer-events:none}
  #doorIntro.show{display:flex;opacity:1}
  #doorIntroTitle{font-size:clamp(20px,3.4vw,40px);
    letter-spacing:.28em;text-indent:.28em;font-weight:800;
    color:#eef2ff;text-shadow:0 0 40px rgba(120,150,255,.7);
    text-align:center;transition:opacity .35s ease;
    background:rgba(6,8,16,.72);border:1px solid rgba(150,170,255,.35);
    border-radius:14px;padding:14px 42px;box-shadow:0 12px 40px rgba(0,0,0,.7);
    margin-top:40px}
  #doorIntroFooter{font-size:clamp(16px,2vw,24px);
    font-weight:800;color:#ffd27f;text-shadow:0 0 30px rgba(255,210,80,.6);
    opacity:0;transition:opacity .4s ease;
    background:rgba(6,8,16,.72);border:1px solid rgba(255,210,80,.4);
    border-radius:14px;padding:12px 36px;box-shadow:0 12px 40px rgba(0,0,0,.7);
    margin-bottom:40px;letter-spacing:.28em}
  #doorIntroFooter.show{opacity:1}
  #skipCutscene{position:fixed;top:24px;right:24px;z-index:80;
    padding:12px 26px;background:rgba(6,8,16,.85);
    border:1px solid rgba(150,170,255,.5);color:#c8d3ff;
    font-family:inherit;font-size:13px;font-weight:800;
    letter-spacing:.22em;text-transform:uppercase;border-radius:10px;cursor:pointer;
    display:none;transition:all .2s ease;box-shadow:0 8px 30px rgba(0,0,0,.6)}
  #skipCutscene:hover{background:rgba(30,40,72,.95);border-color:#7f93ff;
    color:#eef2ff;box-shadow:0 0 30px rgba(120,150,255,.5)}
  #skipCutscene.show{display:block}
  #levelBadge{position:fixed;left:50%;top:16px;transform:translateX(-50%);
    z-index:12;padding:8px 22px;border-radius:10px;background:rgba(6,8,16,.82);
    border:1px solid rgba(180,77,255,.5);color:#e0c8ff;font-size:12px;font-weight:800;
    letter-spacing:.28em;text-transform:uppercase;text-shadow:0 0 14px rgba(180,77,255,.6);
    opacity:0;transition:opacity .3s ease}
  #levelBadge.show{opacity:1}
  #levelBadge b{color:#c48cff}
  #coins{position:fixed;right:16px;top:16px;z-index:12;
    padding:10px 18px;border-radius:12px;background:rgba(6,8,16,.82);
    border:1px solid rgba(255,210,80,.45);color:#ffe9a8;
    font-size:clamp(16px,1.8vw,22px);font-weight:800;letter-spacing:.08em;
    text-shadow:0 0 16px rgba(255,210,80,.55);opacity:0;transition:opacity .3s ease;
    display:flex;align-items:center;gap:10px}
  #coins.show{opacity:1}
  #coins b{color:#ffd27f}
  #coins .icon{font-size:1.15em;filter:drop-shadow(0 0 8px #ffb84d)}
  #coinFly{position:fixed;right:60px;top:60px;z-index:13;
    pointer-events:none;font-size:22px;font-weight:800;color:#9dffa8;
    text-shadow:0 0 18px rgba(120,255,160,.8);opacity:0;transform:translateY(0);
    transition:opacity .2s ease, transform .9s cubic-bezier(.2,.9,.2,1)}
  #coinFly.show{opacity:1;transform:translateY(-60px)}
  #viewBadge{position:fixed;left:16px;top:16px;z-index:12;
    padding:8px 14px;border-radius:10px;background:rgba(6,8,16,.82);
    border:1px solid rgba(150,170,255,.35);color:#c8d3ff;font-size:12px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;opacity:0;transition:opacity .3s ease}
  #viewBadge.show{opacity:1}
  #viewBadge b{color:#9db0ff}
  #fpsBadge{position:fixed;left:16px;top:56px;z-index:12;
    padding:6px 12px;border-radius:8px;background:rgba(6,8,16,.72);
    border:1px solid rgba(150,170,255,.25);color:#8b9ac9;
    font-size:11px;font-weight:700;letter-spacing:.18em;opacity:0;
    transition:opacity .3s ease;font-family:ui-monospace,Menlo,monospace}
  #fpsBadge.show{opacity:.85}
  #fpsBadge b{color:#9dffa8}
  #fpsBadge.warn b{color:#ffd27f}
  #fpsBadge.bad b{color:#ff7f7f}
  #inv{position:fixed;left:16px;bottom:16px;z-index:14;
    display:none;gap:10px;padding:10px;border-radius:12px;
    background:rgba(6,8,16,.78);border:1px solid rgba(150,170,255,.3)}
  #inv.show{display:flex}
  #inv .slot{width:64px;height:64px;border-radius:10px;
    background:rgba(20,26,48,.9);border:2px solid rgba(150,170,255,.25);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .15s ease;padding:6px}
  #inv .slot:hover{border-color:rgba(150,170,255,.6);background:rgba(30,38,66,.95)}
  #inv .slot.selected{border-color:#7f93ff;box-shadow:0 0 22px rgba(120,150,255,.65);
    background:rgba(40,52,96,.95)}
  #inv .slot img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 0 6px rgba(120,200,255,.5));user-select:none}
  #shop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(4,6,14,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #shop.show{display:flex}
  #shopInner{background:linear-gradient(180deg, rgba(22,28,52,.98), rgba(12,16,32,.98));
    border:1px solid rgba(150,170,255,.35);border-radius:18px;
    padding:28px 36px 32px;min-width:min(560px,88vw);max-width:min(720px,92vw);
    max-height:85vh;overflow-y:auto;
    box-shadow:0 24px 80px rgba(0,0,0,.7), 0 0 80px rgba(120,150,255,.15)}
  #shopInner h2{font-size:22px;letter-spacing:.28em;font-weight:800;text-indent:.28em;
    color:#eef2ff;text-align:center;margin-bottom:12px;text-shadow:0 0 30px rgba(120,150,255,.6)}
  #shopWallet{text-align:center;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:#ffd27f;margin-bottom:22px;font-weight:700}
  #shopWallet b{color:#ffe9a8;font-size:15px}
  #shopGrid{display:grid;grid-template-columns:1fr;gap:14px}
  .skinCard{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:12px;
    background:rgba(20,26,48,.9);border:1px solid rgba(150,170,255,.2);
    cursor:pointer;transition:all .2s ease}
  .skinCard:hover{border-color:rgba(150,170,255,.6);background:rgba(30,38,66,.95);
    transform:translateY(-1px)}
  .skinCard.equipped{border-color:#7f93ff;background:rgba(40,52,96,.95);
    box-shadow:0 0 30px rgba(120,150,255,.35)}
  .skinCard.locked{cursor:not-allowed;opacity:.7}
  .skinCard.locked:hover{border-color:rgba(255,120,120,.4);
    background:rgba(30,20,26,.95);transform:none}
  .skinCard .swatch{width:44px;height:44px;border-radius:10px;
    background:linear-gradient(135deg,#4da6ff,#7fd4ff);flex-shrink:0;
    border:1px solid rgba(255,255,255,.15)}
  .skinCard .info{flex:1;min-width:0}
  .skinCard .skinName{font-size:15px;font-weight:700;color:#eef2ff;letter-spacing:.05em}
  .skinCard .skinSub{font-size:11px;color:#8b9ac9;letter-spacing:.2em;
    text-transform:uppercase;margin-top:3px}
  .skinCard .tag{font-size:11px;font-weight:800;letter-spacing:.2em;
    padding:6px 12px;border-radius:8px;text-transform:uppercase;flex-shrink:0;
    display:flex;align-items:center;gap:5px}
  .skinCard .tag.free{background:rgba(120,255,160,.15);color:#9dffa8;border:1px solid rgba(120,255,160,.35)}
  .skinCard .tag.equipped{background:rgba(120,150,255,.25);color:#c8d3ff;border:1px solid rgba(150,170,255,.55)}
  .skinCard .tag.buy{background:rgba(255,210,80,.15);color:#ffd27f;border:1px solid rgba(255,210,80,.4)}
  .skinCard .tag.owned{background:rgba(150,170,255,.18);color:#c8d3ff;border:1px solid rgba(150,170,255,.4)}
  .skinCard .tag.cant{background:rgba(255,120,120,.13);color:#ff9a9a;border:1px solid rgba(255,120,120,.35)}
  #shopHint{text-align:center;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:#6e7cab;margin-top:22px}
  #shopHint .kbd{display:inline-block;padding:1px 8px;border:1px solid #3a4a7a;
    border-radius:4px;background:#141a30;color:#dfe6ff;font-size:11px}
  #levelSelect{position:fixed;inset:0;z-index:52;display:none;align-items:center;
    justify-content:center;background:rgba(4,6,14,.88);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #levelSelect.show{display:flex}
  #levelSelectInner{background:linear-gradient(180deg, rgba(22,28,52,.98), rgba(12,16,32,.98));
    border:1px solid rgba(150,170,255,.4);border-radius:18px;
    padding:32px 44px 36px;min-width:min(540px,88vw);max-width:min(720px,92vw);
    box-shadow:0 24px 80px rgba(0,0,0,.7), 0 0 80px rgba(120,150,255,.2)}
  #levelSelectInner h2{font-size:22px;letter-spacing:.28em;font-weight:800;text-indent:.28em;
    color:#eef2ff;text-align:center;margin-bottom:8px;
    text-shadow:0 0 30px rgba(120,150,255,.6)}
  #levelSelectSub{text-align:center;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:#8b9ac9;margin-bottom:26px}
  #levelSelectGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .levelCard{padding:22px 18px;border-radius:14px;background:rgba(20,26,48,.92);
    border:2px solid rgba(150,170,255,.2);cursor:pointer;transition:all .2s ease;
    text-align:center}
  .levelCard:hover{border-color:#7f93ff;background:rgba(30,38,66,.95);
    transform:translateY(-2px);box-shadow:0 0 30px rgba(120,150,255,.4)}
  .levelCard.current{border-color:#9dffa8;background:rgba(24,50,30,.9);
    box-shadow:0 0 30px rgba(120,255,160,.3)}
  .levelCard.current:hover{border-color:#9dffa8;box-shadow:0 0 40px rgba(120,255,160,.5)}
  .levelCard.locked{cursor:not-allowed;opacity:.5;border-color:rgba(255,120,120,.2)}
  .levelCard.locked:hover{border-color:rgba(255,120,120,.2);
    background:rgba(20,26,48,.92);transform:none;box-shadow:none}
  .levelCard.club{border-color:rgba(180,77,255,.5);
    background:rgba(40,20,60,.92)}
  .levelCard.club:hover{border-color:#c48cff;
    box-shadow:0 0 40px rgba(180,77,255,.5);transform:translateY(-2px)}
  .levelCard .levelNum{font-size:clamp(18px,2.2vw,24px);font-weight:800;
    letter-spacing:.22em;color:#eef2ff;margin-bottom:8px;
    text-shadow:0 0 20px rgba(120,150,255,.5)}
  .levelCard.club .levelNum{color:#e0c8ff;text-shadow:0 0 20px rgba(180,77,255,.7)}
  .levelCard .levelDesc{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:#8b9ac9;margin-bottom:12px;line-height:1.5}
  .levelCard .levelTag{font-size:11px;font-weight:800;letter-spacing:.22em;
    padding:5px 14px;border-radius:8px;text-transform:uppercase;display:inline-block;
    background:rgba(150,170,255,.2);border:1px solid rgba(150,170,255,.5);color:#c8d3ff}
  .levelCard.current .levelTag{background:rgba(120,255,160,.18);
    border-color:rgba(120,255,160,.55);color:#9dffa8}
  .levelCard.locked .levelTag{background:rgba(255,120,120,.12);
    border-color:rgba(255,120,120,.35);color:#ff9a9a}
  .levelCard.club .levelTag{background:rgba(180,77,255,.18);
    border-color:rgba(180,77,255,.55);color:#e0c8ff}
  #levelSelectHint{text-align:center;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:#6e7cab;margin-top:22px}
  #levelSelectHint .kbd{display:inline-block;padding:1px 8px;border:1px solid #3a4a7a;
    border-radius:4px;background:#141a30;color:#dfe6ff;font-size:11px}
</style>
</head>
<body>

<div id="overlay"><h1>PICK A DOOR</h1><p id="status">Loading&hellip;</p></div>
<div id="crosshair"></div>
<div id="countdown"></div>
<div id="levelBadge">Level <b id="levelNum">1</b></div>
<div id="coins"><span class="icon">🪙</span><b id="coinCount">0</b></div>
<div id="coinFly">+10</div>
<div id="viewBadge">View: <b id="viewLabel">1st</b></div>
<div id="fpsBadge">FPS <b id="fpsVal">60</b></div>
<div id="inv"></div>
<div id="hud"></div>
<div id="captions"></div>
<div id="controls">WASD move &nbsp;·&nbsp; Mouse look &nbsp;·&nbsp; <span class="kbd" style="color:#ffd27f">E</span> interact &nbsp;·&nbsp; <span class="kbd" style="color:#7fd4ff">Space</span> jump &nbsp;·&nbsp; <span class="kbd" style="color:#7fd4ff">4</span> bazooka &nbsp;·&nbsp; <span class="kbd" style="color:#7fd4ff">3</span> view &nbsp;·&nbsp; <span class="kbd" style="color:#7fd4ff">F</span> quality</div>

<div id="doorIntro"><div id="doorIntroTitle">YOU CHOSE A DOOR</div><div id="doorIntroFooter">GOOD LUCK.</div></div>
<button id="skipCutscene">SKIP ▶▶</button>
<div id="jumpscareBlack"></div>
<div id="fadeout"></div>

<div id="shop">
  <div id="shopInner">
    <h2 id="shopTitle">SKIN SHOP</h2>
    <div id="shopWallet">Wallet: <b><span id="shopWalletCoins">0</span> 🪙</b></div>
    <div id="shopGrid"></div>
    <p id="shopHint">Press <span class="kbd">E</span> or <span class="kbd">Esc</span> to close</p>
  </div>
</div>

<div id="levelSelect">
  <div id="levelSelectInner">
    <h2>CHOOSE A LEVEL</h2>
    <div id="levelSelectSub">Pick a level to play</div>
    <div id="levelSelectGrid"></div>
    <p id="levelSelectHint">Press <span class="kbd">E</span> or <span class="kbd">Esc</span> to close</p>
  </div>
</div>

<script type="importmap">

</script>

function buildDoor(gltf, name, doorX, tune, glowHex) {

  model.scale.multiply(new THREE.Vector3(size.x > 1e-4 ? ROOM.doorW/size.x : 1, size.y > 1e-4 ? ROOM.doorH/size.y : 1, 1));
  const g = new THREE.Group(); g.add(model);

function placeDoor(door) {
  door.group.rotation.y = 0; door.group.position.set(0,0,0); door.group.updateMatrixWorld(true);
  door.group.rotation.y = door.fixRotY; door.group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(door.group); const c = new THREE.Vector3(); box.getCenter(c);
  door.group.position.x -= c.x; door.group.position.y -= box.min.y; door.group.position.z -= c.z;
  door.wrapper.position.set(door.doorX + door.fixPosX, 0, -ROOM.D/2 + 0.08);
}

function buildWater(waterG, parent, innerW, innerD) {

  const pool = usable.length ? usable : clips;
  const idleClip = pickClip(pool, [/^idle$/i, /idle/i, /pose/i, /flying/i]);

  if (walkClip && walkClip !== idleClip) { player.walkAction = mixer.clipAction(walkClip); player.walkAction.setLoop(THREE.LoopRepeat, Infinity); }

function renderItemIcon(item, size = 128) {
  const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, size, size);
  if (item.id === 'speedCoil' || item.id === 'gravityCoil') {
    const baseColor = item.color1;
    const glowColor = item.id === 'speedCoil' ? 'rgba(255,68,68,0.35)' : 'rgba(77,136,255,0.35)';
    const hiColor = item.id === 'speedCoil' ? 'rgba(255,200,200,0.95)' : 'rgba(200,220,255,0.95)';
    const cx = size/2, cy = size/2, loops = 4, radius = size * 0.34, lineW = size * 0.09;
    ctx.lineCap = 'round';
    const draw = (color, lw, dy = 0) => {
      ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
      for (let i = 0; i <= loops * 2 * Math.PI; i += 0.15) {
        const t = i / (loops * 2 * Math.PI);
        const r = radius * (0.35 + t * 0.65);
        const x = cx + Math.cos(i) * r;
        const y = cy + Math.sin(i) * r * 0.55 + dy;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    };
    draw(glowColor, lineW + 8); draw(baseColor, lineW); draw(hiColor, lineW * 0.35, -1.5);
  } else if (item.id === 'bazooka') {
    const cx = size/2, cy = size/2, w = size * 0.75, h = size * 0.16, y = cy - h/2;
    ctx.fillStyle = '#555'; ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
    ctx.fillRect(cx - w/2, y, w*0.7, h); ctx.strokeRect(cx - w/2, y, w*0.7, h);
    ctx.fillStyle = '#333'; ctx.fillRect(cx - w/2, cy - h*0.9, w*0.15, h*1.8);
    ctx.fillStyle = '#222'; ctx.fillRect(cx + w*0.05, cy + h*0.4, w*0.1, h*1.6);
    ctx.fillStyle = '#666'; ctx.fillRect(cx + w*0.15, y - h*0.5, w*0.08, h*0.5);
  } else {
    const g = ctx.createRadialGradient(size/2, size/2, 2, size/2, size/2, size/2);
    g.addColorStop(0, item.color2 || '#7fd4ff'); g.addColorStop(1, item.color1 || '#4da6ff');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(size/2, size/2, size*0.36, 0, Math.PI * 2); ctx.fill();
  }

}

function fireBazooka() {
  if (bazookaCooldown > 0) return;
  if (equippedItemId !== 'bazooka') return;
  if (playerState !== 'minecraft' && playerState !== 'bad') return;
  bazookaCooldown = BAZOOKA_COOLDOWN;
  bazookaSound.currentTime = 0; bazookaSound.play().catch(() => {});

  let originX = 0, originZ = 0, enemyPos = null, alreadyOut = false;
  if (playerState === 'minecraft' && MC_ENEMY.group) {
    originX = MINECRAFT.origin.x; originZ = MINECRAFT.origin.z; enemyPos = MC_ENEMY.group.position;
    alreadyOut = MC_ENEMY.killed || MC_ENEMY.stunTimer > 0;
  } else if (playerState === 'bad' && WORM.group) {
    originX = BAD.origin.x; originZ = BAD.origin.z; enemyPos = WORM.group.position;
    alreadyOut = WORM.killed || WORM.stunTimer > 0;
  }
  if (!enemyPos || alreadyOut) return;
  const ex = originX + enemyPos.x, ez = originZ + enemyPos.z;
  const dx = ex - player.x, dz = ez - player.z;
  const dist = Math.hypot(dx, dz);
  if (dist > 30 || dist < 0.1) return;
  const fwdX = -Math.sin(yaw), fwdZ = -Math.cos(yaw);
  if ((dx * fwdX + dz * fwdZ) / dist < 0.55) return;
  if (playerState === 'minecraft') MC_ENEMY.stunTimer = VERITY_STUN_TIME;
  else if (playerState === 'bad')    WORM.stunTimer = VERITY_STUN_TIME;
  spawnExplosion(ex, 1.5, ez);
  hud.innerHTML = '<span class="green">Direct hit! Stunned for ' + VERITY_STUN_TIME + 's</span>';
  hud.classList.add('show');
  setTimeout(() => { if (playerState === 'minecraft' || playerState === 'bad') hud.classList.remove('show'); }, 1800);

function updateExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {

let last = performance.now();
let frames = 0, fpsTimer = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const t = now * 0.001;

  frames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    const fps = Math.round(frames / fpsTimer);
    fpsVal.textContent = fps;
    fpsBadge.classList.remove('warn'); fpsBadge.classList.remove('bad');
    if (fps < 25) fpsBadge.classList.add('bad');
    else if (fps < 50) fpsBadge.classList.add('warn');
    frames = 0; fpsTimer = 0;
  }

  if (bazookaCooldown > 0) bazookaCooldown -= dt;

  if (started && !shopOpen && !levelSelectOpen && !doorIntroActive) {
    const jumpscare = (playerState === 'minecraft' && MC_ENEMY.killed)
                   || (playerState === 'bad' && WORM.killed);

    else if (playerState === 'bad') { if (!jumpscare) updateBadPlayer(dt); else updateWalkSound(false); updateWorm(dt); }
    else if (playerState === 'safe') updateSafePlayer(dt);
    else if (playerState === 'disco') updateDiscoPlayer(dt);

    if (!jumpscare) {
      if (!player.onGround || player.vy !== 0) {
        player.vy -= ROOM.gravity * gravityMultiplier() * dt;
        player.y += player.vy * dt;
        if (player.y <= 0) { player.y = 0; player.vy = 0; player.onGround = true; }

    if (countdownActive && !jumpscare) {
      countdownAccum += dt;
      while (countdownAccum >= 1) {
        countdownAccum -= 1; countdown--; updateCountdownUI();
        if (countdown <= 0) {
          countdownActive = false;
          if (playerState === 'minecraft') {
            awardCoins(MC_SURVIVE_REWARD);
            hud.innerHTML = '<span class="green">You survived! +' + MC_SURVIVE_REWARD + ' coins</span>';
            hud.classList.add('show');

          } else teleportToLobby(true);

        }
      }
    }
  } else if (shopOpen || levelSelectOpen) {
    setPlayerMoving(false); updateWalkSound(false); updateSplashSound(false);
  } else if (doorIntroActive) { setPlayerMoving(false); updateWalkSound(false); }

  for (const m of mixers) m.update(dt);
  if (catLobby.mixer) catLobby.mixer.update(dt);
  if (catPool.mixer)  catPool.mixer.update(dt);
  if (catDisco.mixer) catDisco.mixer.update(dt);
  if (player.mixer)   player.mixer.update(dt);
  if (skinNpc.mixer)  skinNpc.mixer.update(dt);
  if (itemNpc.mixer)  itemNpc.mixer.update(dt);
  if (MC_ENEMY.mixer) MC_ENEMY.mixer.update(dt);
  if (WORM.mixer)     WORM.mixer.update(dt);

  updateExplosions(dt);

  if (DISCO.ballGroup) DISCO.ballGroup.rotation.y += dt * 1.6;
  if (DISCO.lights && DISCO.lights.length) {
    for (const dl of DISCO.lights) {
      dl.phase += dt * 2.2;
      dl.light.intensity = 12 + Math.sin(dl.phase) * 10;
    }
  }

  faceTargetToPlayer(catLobby, 30); faceTargetToPlayer(catPool, 30); faceTargetToPlayer(catDisco, 30);

  if (skinNpc.group) {
    const dx = camera.position.x - skinNpc.group.position.x, dz = camera.position.z - skinNpc.group.position.z;
    skinNpc.group.rotation.y = Math.atan2(dx, dz);
  }
  if (itemNpc.group) {
    const dx = camera.position.x - itemNpc.group.position.x, dz = camera.position.z - itemNpc.group.position.z;
    itemNpc.group.rotation.y = Math.atan2(dx, dz);
  }
  if (benjiNpc.group) {
    const dx = camera.position.x - benjiNpc.group.position.x, dz = camera.position.z - benjiNpc.group.position.z;
    benjiNpc.group.rotation.y = Math.atan2(dx, dz);
  }
  if (benjiDiscoNpc.group) {
    const dx = camera.position.x - benjiDiscoNpc.group.position.x, dz = camera.position.z - benjiDiscoNpc.group.position.z;
    benjiDiscoNpc.group.rotation.y = Math.atan2(dx, dz);
  }

  if (duck.group && !onDuck) {
    duck.phase += dt * 1.6;
    duck.group.position.y = duck.baseY + Math.sin(duck.phase) * 0.06;
    duck.group.rotation.y = Math.sin(duck.phase * 0.4) * 0.2;
  }

  if (player.model) {
    let targetAngle;
    if (player.faceCamera) targetAngle = Math.atan2(camera.position.x - player.x, camera.position.z - player.z);
    else if (player.isMoving) { targetAngle = player.moveAngle; player.lastMoveAngle = targetAngle; }
    else targetAngle = (player.lastMoveAngle !== undefined) ? player.lastMoveAngle : player.displayAngle;
    const k = 1 - Math.exp(-14 * dt);

    player.model.rotation.y = player.displayAngle;
    player.model.position.set(player.x, player.y + player.yOffset, player.z);

  }

  {

    const ax = new THREE.Vector3(1, 0, 0), ay = new THREE.Vector3(0, 1, 0), az = new THREE.Vector3(0, 0, 1);
    for (const key2 in handItems) {
      const h = handItems[key2];
      if (!h.group.visible) continue;
      const it = h.item, off = it.handOffset;
      const rot = it.handRot || { x: 0, y: 0, z: 0 };
      const s = Math.sin(yaw), c = Math.cos(yaw);
      const rightX = c, rightZ = -s, fwdX = -s, fwdZ = -c;
      h.group.position.set(

      qx.setFromAxisAngle(ax, THREE.MathUtils.degToRad(rot.x || 0));
      qy.setFromAxisAngle(ay, yaw + THREE.MathUtils.degToRad(rot.y || 0));

  if (CUTSCENE.active) updateCutsceneCamera(dt);
  else applyCamera();

  blueLight.intensity = 10 + Math.sin(t * 1.7) * 3;
  redLight.intensity  = 10 + Math.sin(t * 1.7 + Math.PI) * 3;
  if (BAD.cableCarLight && drumRevealed) BAD.cableCarLight.intensity = 24 + Math.sin(t * 3.0) * 8;

  renderer.render(scene, camera);
}

function applyCamera() {
  const eyeY = player.y + ROOM.eyeHeight;
  if (player.view === 1) { camera.position.set(player.x, eyeY, player.z); camera.rotation.set(pitch, yaw, 0, 'YXZ'); return; }
  const dist = 4.5, cosPitch = Math.cos(pitch);
  const fwdX = -Math.sin(yaw) * cosPitch, fwdY = Math.sin(pitch), fwdZ = -Math.cos(yaw) * cosPitch;
  camera.position.set(player.x - fwdX * dist, Math.max(0.6, eyeY - fwdY * dist + 0.4), player.z - fwdZ * dist);
  const lookDist = 12;
  camera.lookAt(player.x + fwdX * lookDist, eyeY + fwdY * lookDist, player.z + fwdZ * lookDist);
}

function updateLobbyPlayer(dt) {
  const running = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const speed = (running ? ROOM.runSpeed : ROOM.walkSpeed) * speedMultiplier();
  const fwd = ((keys['KeyW']||keys['ArrowUp'])?1:0) - ((keys['KeyS']||keys['ArrowDown'])?1:0);
  const str = ((keys['KeyD']||keys['ArrowRight'])?1:0) - ((keys['KeyA']||keys['ArrowLeft'])?1:0);
  const moving = !!(fwd || str);
  setPlayerMoving(moving); updateWalkSound(moving && locked);
  if (moving) {
    const s = Math.sin(yaw), c = Math.cos(yaw);
    let vx = -s*fwd + c*str, vz = -c*fwd - s*str;
    const L = Math.hypot(vx, vz); vx/=L; vz/=L;
    player.moveAngle = Math.atan2(vx, vz);
    const hw = ROOM.W/2 - 0.5, hd = ROOM.D/2 - 0.5;
    let tryX = Math.max(-hw, Math.min(hw, player.x + vx*speed*dt));
    if (!lobbyCollides(tryX, player.z)) player.x = tryX;
    let tryZ = Math.max(-hd, Math.min(hd, player.z + vz*speed*dt));
    if (!lobbyCollides(player.x, tryZ)) player.z = tryZ;
  }
  const p = padAt(player.x, player.z); const newPad = p ? p.name : null;
  if (newPad !== wasOnPad) { wasOnPad = newPad; refreshHud(); }
  for (const pad of pads) setPadGlow(pad, pad.name === wasOnPad ? 0.55 + Math.sin(performance.now() * 0.004) * 0.15 : 0);
  for (const door of doors) {
    if (door.name === wasOnPad) setDoorGlow(door, door.glowHex, 0.5 + Math.sin(performance.now() * 0.004) * 0.2);
    else setDoorGlow(door, 0x000000, 0);
  }
  for (const door of doors) {
    if (Math.abs(player.x - door.doorX) < 1.1 && player.z < -5.6) {
      if (doorIntroActive || teleporting) return;
      if (currentLevel === 1) {
        if (door.name === 'blue') runDoorIntro('blue', () => teleportToPool());
        else if (door.name === 'red') runDoorIntro('red', () => teleportToMinecraft());
      } else {
        if (door.name === 'blue') runDoorIntro('blue', () => teleportToWireMaze());
        else if (door.name === 'red') runDoorIntro('red', () => teleportToSafe());
      }
      return;
    }
  }
}

function updatePoolPlayer(dt) {
  const running = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const speed = (running ? POOL.runSpeed : POOL.walkSpeed) * speedMultiplier();
  const fwd = ((keys['KeyW']||keys['ArrowUp'])?1:0) - ((keys['KeyS']||keys['ArrowDown'])?1:0);
  const str = ((keys['KeyD']||keys['ArrowRight'])?1:0) - ((keys['KeyA']||keys['ArrowLeft'])?1:0);
  const moving = !!(fwd || str);
  let vx = 0, vz = 0;
  if (moving) {
    const s = Math.sin(yaw), c = Math.cos(yaw);
    vx = -s*fwd + c*str; vz = -c*fwd - s*str;
    const L = Math.hypot(vx, vz); vx /= L; vz /= L;
    player.moveAngle = Math.atan2(vx, vz);
  }
  if (onDuck) {
    setPlayerMoving(moving);
    if (moving && locked) { player.x += vx * speed * dt; player.z += vz * speed * dt; updateSplashSound(true); }
    else updateSplashSound(false);
    const lx = player.x - POOL.origin.x, lz = player.z - POOL.origin.z;
    const hw = POOL.roomW/2 - 0.6, hd = POOL.roomD/2 - 0.6;
    if (lx > hw) player.x = POOL.origin.x + hw;
    if (lx < -hw) player.x = POOL.origin.x - hw;
    if (lz > hd) player.z = POOL.origin.z + hd;
    if (lz < -hd) player.z = POOL.origin.z - hd;
    if (duck.group) {
      duck.group.position.x = player.x - POOL.origin.x;
      duck.group.position.z = player.z - POOL.origin.z;
      duck.group.position.y = duck.baseY;
      duck.group.rotation.y = yaw + THREE.MathUtils.degToRad(POOL.duckFaceOffset);
    }
    if (!isInsidePoolWaterWorld(player.x, player.z)) {
      onDuck = false; updateSplashSound(false);
      hud.innerHTML = '<span class="hint">Off the floaty</span>'; hud.classList.add('show');
      setTimeout(() => { if (playerState === 'pool') hud.classList.remove('show'); }, 1200);
    }
    return;
  }
  setPlayerMoving(moving); updateWalkSound(moving && locked);
  if (moving) {
    const nx = player.x + vx * speed * dt, nz = player.z + vz * speed * dt;
    if (isInsidePoolWaterWorld(nx, nz)) {
      const dw = duckWorldPos();
      if (dw) {
        const distToDuck = Math.hypot(nx - dw.x, nz - dw.z);
        if (distToDuck < POOL.boardDist) {
          onDuck = true; player.x = dw.x; player.z = dw.z;
          updateWalkSound(false); updateSplashSound(true);
          hud.innerHTML = '<span class="hint">On the floaty · walk to the deck to get off</span>';
          hud.classList.add('show');
          setTimeout(() => { if (playerState === 'pool' && onDuck) hud.classList.remove('show'); }, 2200);
          return;
        }
      }
      return;
    }
    player.x = nx; player.z = nz;
  }
  const lx = player.x - POOL.origin.x, lz = player.z - POOL.origin.z;
  const hw = POOL.roomW/2 - 0.6, hd = POOL.roomD/2 - 0.6;
  if (lx > hw) player.x = POOL.origin.x + hw;
  if (lx < -hw) player.x = POOL.origin.x - hw;
  if (lz > hd) player.z = POOL.origin.z + hd;
  if (lz < -hd) player.z = POOL.origin.z - hd;
  if (isInsidePoolWaterWorld(player.x, player.z)) {
    player.x = POOL.origin.x + POOL.spawnLocalX; player.z = POOL.origin.z + POOL.spawnLocalZ;
  }
}

function updateMinecraftPlayer(dt) {
  const running = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const speed = (running ? MINECRAFT.runSpeed : MINECRAFT.walkSpeed) * speedMultiplier();
  const fwd = ((keys['KeyW']||keys['ArrowUp'])?1:0) - ((keys['KeyS']||keys['ArrowDown'])?1:0);

  if (!moving) return;
  const s = Math.sin(yaw), c = Math.cos(yaw);
  let vx = -s*fwd + c*str, vz = -c*fwd - s*str;
  const L = Math.hypot(vx, vz); vx/=L; vz/=L;
  player.moveAngle = Math.atan2(vx, vz);
  const hw = MINECRAFT.roomW/2 - 0.7, hd = MINECRAFT.roomD/2 - 0.7;
  let tryX = Math.max(MINECRAFT.origin.x - hw, Math.min(MINECRAFT.origin.x + hw, player.x + vx * speed * dt));
  if (!mcCollides(tryX, player.z)) player.x = tryX;
  let tryZ = Math.max(MINECRAFT.origin.z - hd, Math.min(MINECRAFT.origin.z + hd, player.z + vz * speed * dt));
  if (!mcCollides(player.x, tryZ)) player.z = tryZ;
}

function updateBadPlayer(dt) {
  const running = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const speed = (running ? BAD.runSpeed : BAD.walkSpeed) * speedMultiplier();
  const fwd = ((keys['KeyW']||keys['ArrowUp'])?1:0) - ((keys['KeyS']||keys['ArrowDown'])?1:0);
  const str = ((keys['KeyD']||keys['ArrowRight'])?1:0) - ((keys['KeyA']||keys['ArrowLeft'])?1:0);
  const moving = !!(fwd || str);
  setPlayerMoving(moving); updateWalkSound(moving && locked);
  if (moving) {
    const s = Math.sin(yaw), c = Math.cos(yaw);
    let vx = -s*fwd + c*str, vz = -c*fwd - s*str;
    const L = Math.hypot(vx, vz); vx/=L; vz/=L;
    player.moveAngle = Math.atan2(vx, vz);
    const hw = BAD.mazeCols * BAD.cellSize / 2 - 0.4;
    const hd = BAD.mazeRows * BAD.cellSize / 2 - 0.4;
    let tryX = Math.max(BAD.origin.x - hw, Math.min(BAD.origin.x + hw, player.x + vx * speed * dt));
    if (!badCollides(tryX, player.z)) player.x = tryX;
    let tryZ = Math.max(BAD.origin.z - hd, Math.min(BAD.origin.z + hd, player.z + vz * speed * dt));
    if (!badCollides(player.x, tryZ)) player.z = tryZ;
  }
  nearDrum = nearDrumFn();
  if (!drumRevealed) {
    if (nearDrum && keys['KeyE']) {
      drumHoldTimer += dt;
      if (drumHoldTimer >= BAD.drumHoldTime) revealBadExit();
      else {
        const pct = Math.min(1, drumHoldTimer / BAD.drumHoldTime); const bars = Math.floor(pct * 10);
        hud.innerHTML = '<span class="purple">Holding E&hellip; [' + '█'.repeat(bars) + '░'.repeat(10 - bars) + '] ' + drumHoldTimer.toFixed(1) + 's</span>';
        hud.classList.add('show');
      }
    } else if (drumHoldTimer > 0) { drumHoldTimer = 0; refreshHud(); }
  }
  const ccx = BAD.origin.x + BAD.cableCarLocal.x, ccz = BAD.origin.z + BAD.cableCarLocal.z;
  const wasNear = nearCableCar;
  nearCableCar = drumRevealed && Math.hypot(player.x - ccx, player.z - ccz) < BAD.exitRange;
  if (nearCableCar !== wasNear) refreshHud();
}

    player.x = tryX;

function updateDiscoPlayer(dt) {
  const running = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const speed = (running ? DISCO.runSpeed : DISCO.walkSpeed) * speedMultiplier();
  const fwd = ((keys['KeyW']||keys['ArrowUp'])?1:0) - ((keys['KeyS']||keys['ArrowDown'])?1:0);
  const str = ((keys['KeyD']||keys['ArrowRight'])?1:0) - ((keys['KeyA']||keys['ArrowLeft'])?1:0);
  const moving = !!(fwd || str);
  setPlayerMoving(moving); updateWalkSound(moving && locked);
  if (moving) {

    const L = Math.hypot(vx, vz); vx/=L; vz/=L;

    const hw = DISCO.roomW/2 - 0.7, hd = DISCO.roomD/2 - 0.7;

    player.x = tryX;
    let tryZ = Math.max(DISCO.origin.z - hd, Math.min(DISCO.origin.z + hd, player.z + vz * speed * dt));
    player.z = tryZ;
  }

function updateWalkSound(shouldPlay) {
  if (shouldPlay && !walkSoundPlaying) { walkSound.currentTime = 0; walkSound.play().catch(() => {}); walkSoundPlaying = true; }
  else if (!shouldPlay && walkSoundPlaying) { try { walkSound.pause(); } catch (_) {} walkSoundPlaying = false; }
}
function updateSplashSound(shouldPlay) {
  if (shouldPlay && !splashPlaying) { splashSound.currentTime = 0; splashSound.play().catch(() => {}); splashPlaying = true; }
  else if (!shouldPlay && splashPlaying) { try { splashSound.pause(); } catch (_) {} splashPlaying = false; }
}
function padAt(x, z) {
  for (const p of pads) if (Math.abs(x - p.x) < p.w / 2 && Math.abs(z - p.z) < p.d / 2) return p;
  return null;
}
function setDoorGlow(door, hex, i) {
  door.group.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) if (m && m.emissive) { m.emissive.setHex(hex); m.emissiveIntensity = i; }
  });
}
function setPadGlow(pad, i) {
  pad.rim.material.opacity = 0.22 + i * 0.6;
  if (pad.mesh.material.emissive) { pad.mesh.material.emissive.setHex(pad.glowHex); pad.mesh.material.emissiveIntensity = i; }
}

document.addEventListener('mousemove', e => {
  if (!locked || shopOpen || levelSelectOpen || doorIntroActive) return;
  if (MC_ENEMY.killed || WORM.killed) return;
  yaw -= e.movementX * ROOM.mouseSens;
  pitch -= e.movementY * ROOM.mouseSens;
  pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, pitch));
});
overlay.addEventListener('click', () => {
  if (!ready) return;
  overlay.classList.add('hidden'); started = true;
  music.play().catch(() => {});
  setTimeout(speakIntro, 200);
  crosshair.classList.add('show'); controls.classList.add('show'); coinsEl.classList.add('show');
  viewBadge.classList.add('show'); levelBadge.classList.add('show'); fpsBadge.classList.add('show');
  updateCoinsUI(); updateLevelBadge(); refreshHud(); buildInventoryUI();
  renderer.domElement.requestPointerLock();
});
renderer.domElement.addEventListener('click', () => {
  if (!started || shopOpen || levelSelectOpen || doorIntroActive) return;
  if (document.pointerLockElement !== renderer.domElement) { renderer.domElement.requestPointerLock(); return; }
  if (equippedItemId === 'bazooka') fireBazooka();
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (!started) return;
  if (!locked) {
    updateWalkSound(false); updateSplashSound(false);
    petLookedAt = false; crosshair.classList.remove('hot');
    if (!shopOpen && !levelSelectOpen && !MC_ENEMY.killed && !WORM.killed && !doorIntroActive) {
      hud.innerHTML = 'Click to resume'; hud.classList.add('show');
    }
  } else refreshHud();
});
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.code === 'KeyR' && !e.shiftKey) {
    e.preventDefault();
    if (confirm('Reset your Pick A Door save? (coins, level, purchases)')) resetProgress();
    return;
  }
  if (levelSelectOpen) { if (e.code === 'KeyE' || e.code === 'Escape') { e.preventDefault(); closeLevelSelect(); } return; }
  if (shopOpen) { if (e.code === 'KeyE' || e.code === 'Escape') { e.preventDefault(); closeShop(); } return; }
  if (doorIntroActive) {
    if (e.code === 'Escape') { e.preventDefault(); skipAllCutscenes = true; try { speechSynthesis.cancel(); } catch(_){} }
    return;
  }
  if (e.code === 'KeyO' && started && !e.repeat) { e.preventDefault(); awardCoins(CHEAT_COINS); return; }
  if (e.code === 'KeyF' && started && !e.repeat) { e.preventDefault(); toggleQuality(); return; }
  if (MC_ENEMY.killed || WORM.killed) return;

  if (e.code === 'Space' && started && !e.repeat) {
    if (player.onGround) {
      let jv = ROOM.jumpVel;
      if (equippedItemId === 'gravityCoil') {
        const gc = ITEMS.find(x => x.id === 'gravityCoil');
        if (gc && gc.jumpMult) jv *= gc.jumpMult;
      }
      player.vy = jv; player.onGround = false;
      if (equippedItemId === 'speedCoil' || equippedItemId === 'gravityCoil') {
        coilJumpSound.currentTime = 0; coilJumpSound.play().catch(() => {});
      }
    }
    e.preventDefault(); return;
  }
  if (e.code === 'Digit3' || e.code === 'Numpad3') { if (started && !e.repeat) { e.preventDefault(); toggleView(); } return; }
  if (e.code === 'Digit4' && started && !e.repeat) {
    if (ownedItemIds.has('bazooka')) { e.preventDefault(); if (equippedItemId !== 'bazooka') selectItem('bazooka'); return; }
  }
  if (e.code === 'KeyL' && started && !e.repeat) { e.preventDefault(); toggleFaceMode(); return; }
  if (started && !e.repeat) {
    const slot = e.code.match(/^Digit([1-9])$/);
    if (slot) {
      const idx = parseInt(slot[1]) - 1;
      const owned = ITEMS.filter(it => ownedItemIds.has(it.id));
      if (owned[idx]) { e.preventDefault(); selectItem(owned[idx].id); return; }
    }
  }
  if (e.code === 'KeyE' && started && !e.repeat) {
    if (playerState === 'disco') { e.preventDefault(); teleportToLobby(false); return; }
    if (playerState === 'safe') { e.preventDefault(); teleportToLobby(false); return; }
    if (playerState === 'bad' && nearCableCar && drumRevealed) { e.preventDefault(); teleportToLobby(false); return; }
    if (benjiNearby && playerState === 'lobby') { openLevelSelect(); return; }
    if (petLookedAt) { petCatObj(activeCat()); return; }
    if (shopNpcNearby) { openShop('skin'); return; }
    if (itemNpcNearby) { openShop('item'); return; }
  }
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
